name: ci
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: mealplan
          POSTGRES_DB: mealplan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MEALPLAN_TEST_DRIVER: ${{ matrix.db }}
      MEALPLAN_TEST_DSN: postgres://postgres:mealplan@localhost:5432/mealplan?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", check-latest: true }
      - name: gofmt
        if: matrix.db == 'sqlite'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
        if: matrix.db == 'sqlite'
      - run: go test ./... -race

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      # vite/esbuild are build-time-only tools (optional peers of vuetify); this step audits shipped runtime deps.
      - run: npm audit --omit=dev --omit=peer --omit=optional --audit-level=high

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", check-latest: true }
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mealplan:ci .
