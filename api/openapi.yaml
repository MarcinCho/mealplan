        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: mealplan_session }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Malformed JSON body (code bad_request)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or expired session (code unauthenticated)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: Wrong login or password (code invalid_credentials)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Admin role required (code forbidden)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Csrf:
      description: Missing or invalid CSRF token (code csrf)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CsrfOrForbidden:
      description: Missing or invalid CSRF token (code csrf) or admin role required (code forbidden)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found in the own household (code not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InviteInvalid:
      description: Invite is invalid, used or expired (code invite_invalid)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict (code setup_done, login_taken, in_use, last_admin or conflict)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Request body over 1 MiB (code too_large)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Content-Type is not application/json (code unsupported_media_type)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PantryFailed:
      description: The change was saved but the pantry could not be updated (code pantry_failed); saving again repairs it
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Validation failed (code invalid_input or password_length) or the import could not produce a draft (code import_blocked, import_unparsable or import_failed)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts (code rate_limited)
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    PrepAllocation:
      type: object
      required: [entryId, date, slot, servings]
      properties:
        entryId: { type: string }
        date: { type: string, format: date }
        slot: { type: string, enum: [breakfast, lunch, dinner, snack] }
        servings: { type: integer }
    PrepDish:
      type: object
      required: [id, recipeId, recipeTitle, portions, writtenOff, allocated, frozen, remaining, allocations]
      properties:
        id: { type: string }
        recipeId: { type: string }
        recipeTitle: { type: string }
        portions: { type: integer }
        writtenOff: { type: integer }
        allocated: { type: integer, description: Portions used by plan entries }
        frozen: { type: integer, description: Portions moved to the freezer }
        remaining: { type: integer }
        allocations: { type: array, items: { $ref: "#/components/schemas/PrepAllocation" } }
    PrepSession:
      type: object
      required: [id, date, name, week, cooked, remaining, dishes]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        name: { type: string }
        week: { type: string, format: date, description: Monday of the shopping week the session belongs to }
        cooked: { type: boolean }
        remaining: { type: integer }
        dishes: { type: array, items: { $ref: "#/components/schemas/PrepDish" } }
    PrepSessionCreate:
      type: object
      required: [date, name]
      properties:
        date: { type: string, format: date }
        name: { type: string }
        week: { type: string, format: date, description: A Monday; defaults from the date }
    PrepSessionInput:
      type: object
      required: [date, name, week, cooked]
      properties:
        date: { type: string, format: date }
        name: { type: string }
        week: { type: string, format: date }
        cooked: { type: boolean }
    PrepDishCreate:
      type: object
      required: [recipeId, portions]
      properties:
        recipeId: { type: string }
        portions: { type: integer }
    PrepDishInput:
      type: object
      required: [portions, writtenOff]
      properties:
        portions: { type: integer }
        writtenOff: { type: integer }
    PrepFreeze:
      type: object
      required: [portions]
      properties:
        portions: { type: integer }
    FreezerItem:
      type: object
      required: [id, dishId, recipeId, title, portions, allocated, remaining, frozenOn, allocations]
      properties:
        id: { type: string }
        dishId: { type: string, nullable: true }
        recipeId: { type: string, nullable: true }
        title: { type: string }
        portions: { type: integer }
        allocated: { type: integer }
        remaining: { type: integer }
        frozenOn: { type: string, format: date }
        allocations: { type: array, items: { $ref: "#/components/schemas/PrepAllocation" } }
    FreezerItemInput:
      type: object
      required: [portions]
      properties:
        recipeId: { type: string, nullable: true }
        label: { type: string, description: Defaults to the recipe title }
        portions: { type: integer }
        frozenOn: { type: string, format: date, description: Defaults to today }
    HouseholdSettings:
      type: object
      required: [portionsPerMeal]
      properties:
        portionsPerMeal: { type: integer, minimum: 1, maximum: 20 }
    NutritionSettings:
      type: object
      required: [enabled, goal]
      properties:
        enabled: { type: boolean }
        goal: { $ref: "#/components/schemas/Macros" }
    Macros:
      type: object
      description: Values are null when unknown (in a day, total and remaining are null for a value nothing supplied).
      required: [kcal, protein, carbs, fat]
      properties:
        kcal: { type: number, nullable: true }
        protein: { type: number, nullable: true }
        carbs: { type: number, nullable: true }
        fat: { type: number, nullable: true }
    ValueSources:
      type: object
      required: [kcal, protein, carbs, fat]
      properties:
        kcal: { type: string, enum: [recipe, computed, missing] }
        protein: { type: string, enum: [recipe, computed, missing] }
        carbs: { type: string, enum: [recipe, computed, missing] }
        fat: { type: string, enum: [recipe, computed, missing] }
    DaySummary:
      type: object
      required: [date, total, goal, remaining, meals, log, missingMeals, missingLog, incomplete, approximate]
      properties:
        date: { type: string, format: date }
        total: { $ref: "#/components/schemas/Macros" }
        goal: { $ref: "#/components/schemas/Macros" }
        remaining: { $ref: "#/components/schemas/Macros" }
        meals:
          type: array
          items:
            type: object
            required: [entryId, title, slot, kind, values, sources, approximate, missing]
            properties:
              entryId: { type: string }
              title: { type: string }
              slot: { type: string, enum: [breakfast, lunch, dinner, snack] }
              kind: { type: string, enum: [meal, prep, out] }
              values: { $ref: "#/components/schemas/Macros" }
              sources: { $ref: "#/components/schemas/ValueSources" }
              approximate: { type: boolean }
              missing: { type: boolean, description: "Free text or no nutrition data; adds nothing to the total" }
        log:
          type: array
          items:
            type: object
            required: [id, productId, name, quantity, unit, values, missing]
            properties:
              id: { type: string }
              productId: { type: string }
              name: { type: string }
              quantity: { type: number }
              unit: { type: string, enum: [g, szt] }
              values: { $ref: "#/components/schemas/Macros" }
              missing: { type: boolean }
        missingMeals: { type: integer }
        missingLog: { type: integer, description: "Log items that supply no value at all" }
        incomplete:
          type: object
          description: Per value, true when some meal or log item did not supply it, so total understates the day
          required: [kcal, protein, carbs, fat]
          properties:
            kcal: { type: boolean }
            protein: { type: boolean }
            carbs: { type: boolean }
            fat: { type: boolean }
        approximate: { type: boolean, description: "Approximate recipe or any incomplete value" }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: {}
    Status:
      type: object
      properties:
        setupRequired: { type: boolean }
        mode: { type: string, enum: [selfhost, hosted] }
    SetupRequest:
      type: object
      required: [householdName, login, password, displayName]
      properties:
        householdName: { type: string, maxLength: 100 }
        login: { type: string, pattern: "^[a-z0-9._-]{3,64}$" }
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, maxLength: 64 }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }
    AcceptRequest:
      type: object
      required: [login, password, displayName]
      properties:
        login: { type: string, pattern: "^[a-z0-9._-]{3,64}$" }
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, maxLength: 64 }
    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            login: { type: string }
            displayName: { type: string }
        household:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        role: { type: string, enum: [admin, member] }
        csrfToken: { type: string }
    CreateInviteRequest:
      type: object
      properties:
        role: { type: string, enum: [admin, member], default: member }
    CreatedInvite:
      type: object
      properties:
        id: { type: string }
        token: { type: string }
        role: { type: string }
        expiresAt: { type: string, format: date-time }
        path: { type: string }
    Invite:
      type: object
      properties:
        id: { type: string }
        role: { type: string }
        expiresAt: { type: string, format: date-time }
    InviteInfo:
      type: object
      properties:
        householdName: { type: string }
        role: { type: string }
        expiresAt: { type: string, format: date-time }
    Member:
      type: object
      properties:
        id: { type: string }
        login: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, member] }
    Ingredient:
      type: object
      required: [name, quantity, unit]
      properties:
        name: { type: string }
        quantity: { type: number, nullable: true, description: Null when the amount is "to taste" }
        unit: { type: string }
        note: { type: string, maxLength: 200, description: "Remark about the ingredient, e.g. a substitution" }
        productId: { type: string, nullable: true, description: "Remembered product of the household used for nutrition; 404 when unknown or foreign" }
        matchedProductId: { type: string, nullable: true, readOnly: true, description: "Output only, only in GET /recipes/{id}: the product the nutrition matcher used (the remembered productId, else the name/alias match); null when none. Ignored in requests." }
    RecipeInput:
      type: object
      required: [title, baseServings]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        baseServings: { type: integer, minimum: 1, maximum: 100 }
        sourceUrl: { type: string, description: Empty or an http(s) address }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        ingredients: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Ingredient" } }
        steps: { type: array, maxItems: 100, items: { type: string, maxLength: 2000 } }
        nutrition: { $ref: "#/components/schemas/RecipeNutritionGiven" }
    RecipeNutritionGiven:
      type: object
      description: Given (manual) values per portion, null when unknown. Kcal 0-5000, others 0-500 g.
      required: [kcal, protein, carbs, fat]
      properties:
        kcal: { type: number, nullable: true, minimum: 0, maximum: 5000 }
        protein: { type: number, nullable: true, minimum: 0, maximum: 500 }
        carbs: { type: number, nullable: true, minimum: 0, maximum: 500 }
        fat: { type: number, nullable: true, minimum: 0, maximum: 500 }
    NutritionPerPortion:
      type: object
      description: Computed per-portion values; given values win per value. Only in GET /recipes/{id}.
      required: [values, sources, approximate, unmatched]
      properties:
        values:
          type: object
          required: [kcal, protein, carbs, fat]
          properties:
            kcal: { type: number, nullable: true }
            protein: { type: number, nullable: true }
            carbs: { type: number, nullable: true }
            fat: { type: number, nullable: true }
        sources:
          type: object
          required: [kcal, protein, carbs, fat]
          properties:
            kcal: { $ref: "#/components/schemas/NutritionSource" }
            protein: { $ref: "#/components/schemas/NutritionSource" }
            carbs: { $ref: "#/components/schemas/NutritionSource" }
            fat: { $ref: "#/components/schemas/NutritionSource" }
        approximate: { type: boolean }
        unmatched: { type: array, items: { type: string }, description: Ingredients not counted or only partly counted }
    NutritionSource:
      type: string
      enum: [recipe, computed, missing]
    Recipe:
      type: object
      required: [id, title, baseServings, sourceUrl, tags, ingredients, steps, nutrition, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        baseServings: { type: integer }
        nutrition: { $ref: "#/components/schemas/RecipeNutritionGiven" }
        nutritionPerPortion: { $ref: "#/components/schemas/NutritionPerPortion" }
        sourceUrl: { type: string }
        tags: { type: array, items: { type: string } }
        ingredients: { type: array, items: { $ref: "#/components/schemas/Ingredient" }, description: Empty in list responses }
        steps: { type: array, items: { type: string }, description: Empty in list responses }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Macros:
      type: object
      description: Values per 100 g, null when unknown
      required: [kcal, protein, carbs, fat]
      properties:
        kcal: { type: number, nullable: true, minimum: 0, maximum: 900 }
        protein: { type: number, nullable: true, minimum: 0, maximum: 100 }
        carbs: { type: number, nullable: true, minimum: 0, maximum: 100 }
        fat: { type: number, nullable: true, minimum: 0, maximum: 100, description: Protein, carbs and fat together are at most 100 }
    ProductInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        per100g: { $ref: "#/components/schemas/Macros" }
        pieceGrams: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 5000 }
        densityGPerMl: { type: number, nullable: true, minimum: 0.2, exclusiveMinimum: true, maximum: 2 }
        aliases: { type: array, maxItems: 20, items: { type: string, maxLength: 200 }, description: Normalized by the server; must not equal another product's name }
    Product:
      type: object
      required: [id, name, per100g, pieceGrams, densityGPerMl, aliases]
      properties:
        id: { type: string }
        name: { type: string }
        per100g: { $ref: "#/components/schemas/Macros" }
        pieceGrams: { type: number, nullable: true }
        densityGPerMl: { type: number, nullable: true }
        aliases: { type: array, items: { type: string } }
    ImportUrlInput:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2000 }
    ImportTextInput:
      type: object
      required: [text]
      properties:
        text: { type: string, description: Up to 100 KB }
    DraftIngredient:
      type: object
      required: [raw, name, quantity, unit, note, confidence]
      properties:
        raw: { type: string, description: The line as found in the source }
        name: { type: string, description: Empty when confidence is unparsed }
        quantity: { type: number, nullable: true }
        unit: { type: string }
        note: { type: string, description: Remark such as "posiekana" or a substitution; saved with the ingredient (max 200 characters, longer ones are cut with a warning) }
        confidence: { type: string, enum: [ok, guess, unparsed] }
    RecipeDraft:
      type: object
      required: [title, servings, sourceUrl, tags, ingredients, steps, nutrition, warnings]
      properties:
        title: { type: string }
        servings: { type: integer, description: 0 when unknown }
        nutrition: { $ref: "#/components/schemas/RecipeNutritionGiven" }
        sourceUrl: { type: string }
        tags: { type: array, items: { type: string } }
        ingredients: { type: array, items: { $ref: "#/components/schemas/DraftIngredient" } }
        steps: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    PlanEntryInput:
      type: object
      required: [date, slot]
      properties:
        date: { type: string, format: date, description: A day within the week }
        slot: { type: string, enum: [breakfast, lunch, dinner, snack] }
        recipeId: { type: string, nullable: true }
        freeText: { type: string }
        servings: { type: integer, description: Zero or omitted means the recipe base servings, or 1 for free-text entries }
        cookUserId: { type: string, nullable: true }
        done: { type: boolean, description: Whether the meal was cooked; defaults to false }
        kind: { type: string, enum: [meal, prep, out], description: "Defaults to meal. prep takes portions from a dish or freezer item (exactly one of prepDishId and freezerItemId); out is a meal eaten out." }
        prepDishId: { type: string, nullable: true }
        freezerItemId: { type: string, nullable: true }
        outValues: { allOf: [{ $ref: "#/components/schemas/Macros" }], nullable: true, description: Eaten-out values per portion; only for kind out }
    PlanEntry:
      type: object
      required: [id, date, slot, recipeId, freeText, servings, cookUserId, done, kind, prepDishId, freezerItemId, outValues]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        slot: { type: string, enum: [breakfast, lunch, dinner, snack] }
        recipeId: { type: string, nullable: true }
        freeText: { type: string }
        servings: { type: integer }
        cookUserId: { type: string, nullable: true }
        done: { type: boolean }
        kind: { type: string, enum: [meal, prep, out] }
        prepDishId: { type: string, nullable: true }
        freezerItemId: { type: string, nullable: true }
        outValues: { allOf: [{ $ref: "#/components/schemas/Macros" }], nullable: true, description: Null unless kind is out }
    Week:
      type: object
      required: [week, entries]
      properties:
        week: { type: string, format: date }
        entries: { type: array, items: { $ref: "#/components/schemas/PlanEntry" } }
    ShoppingItem:
      type: object
      required: [id, week, name, quantity, unit, checked, manual, haveQuantity, moved]
      properties:
        id: { type: string }
        week: { type: string, format: date }
        name: { type: string }
        quantity: { type: number, nullable: true }
        unit: { type: string }
        checked: { type: boolean }
        manual: { type: boolean }
        haveQuantity: { type: number, nullable: true, description: Stock on hand in the item's unit; null when unknown }
        moved: { type: boolean, description: Already moved to the pantry }
    PantryItem:
      type: object
      required: [id, productId, name, quantity, unit, expiresOn, staple]
      properties:
        id: { type: string }
        productId: { type: string }
        name: { type: string }
        quantity: { type: number, nullable: true }
        unit: { type: string }
        expiresOn: { type: string, description: "YYYY-MM-DD or empty" }
        staple: { type: boolean }
    PantryItemInput:
      type: object
      description: productId or name is required
      properties:
        productId: { type: string }
        name: { type: string }
        quantity: { type: number, nullable: true, minimum: 0 }
        unit: { type: string }
        expiresOn: { type: string, description: "YYYY-MM-DD or empty" }
        staple: { type: boolean }
    PantryList:
      type: object
      required: [items, reviewedAt]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PantryItem" } }
        reviewedAt: { type: string, format: date-time, nullable: true }
    ShoppingList:
      type: object
      required: [week, items, previousWeekUndone]
      properties:
        week: { type: string, format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/ShoppingItem" }
        previousWeekUndone:
          type: integer
          minimum: 0
          description: Recipe meals of the previous week not marked done; part of the stock may still be needed for them.
