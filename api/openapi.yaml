openapi: 3.0.3
info:
  title: Mealplan API
  version: 0.1.0
  description: REST API of Mealplan. All responses are JSON; errors use the Error schema.
servers:
  - url: /
paths:
  /api/v1/auth/status:
    get:
      summary: Setup state and deployment mode
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /api/v1/auth/setup:
    post:
      summary: Create the first household and admin (only when no users exist)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "204": { description: Created; session cookies set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/auth/login:
    post:
      summary: Log in with login and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204": { description: Logged in; session cookies set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      summary: End the current session
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
  /api/v1/auth/me:
    get:
      summary: Current user, household, role and CSRF token
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/invites:
    post:
      summary: Create a one-time invite (admin)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Created; the token is shown only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfOrForbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      summary: List pending invites (admin)
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/invites/{id}:
    delete:
      summary: Revoke a pending invite of the own household (admin)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfOrForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/household/members/{id}:
    patch:
      summary: Change a member's role (admin)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, member] }
      responses:
        "204": { description: Role changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfOrForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      summary: Remove a member from the household (admin)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfOrForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/invitations/{token}:
    get:
      summary: Inspect an invite link
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteInfo" }
        "404": { $ref: "#/components/responses/InviteInvalid" }
  /api/v1/auth/invitations/{token}/accept:
    post:
      summary: Accept an invite and create an account
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptRequest" }
      responses:
        "204": { description: Account created; session cookies set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/InviteInvalid" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/household/members:
    get:
      summary: Members of the current household
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/recipes:
    get:
      summary: List recipes of the household (without ingredients and steps)
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a recipe
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/recipes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a recipe with ingredients and steps
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Replace a recipe
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      summary: Delete a recipe
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/products:
    get:
      summary: List the household's products (the bundled starter set is installed on first use)
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, required: false, description: Case-insensitive substring of the name or an alias, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a product
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace a product
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      summary: Delete a product (refused with in_use while the food log references it)
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/recipes/import/url:
    post:
      summary: Fetch a web page and return a recipe draft (nothing is saved)
      description: Limited to 10 requests per minute per user. Only http(s) on default ports; private, loopback, link-local and Tailscale addresses are refused.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportUrlInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { description: Too many imports; see Retry-After (code rate_limited) }
        "504": { description: The page took too long to respond (code import_timeout) }
  /api/v1/recipes/import/text:
    post:
      summary: Parse pasted recipe text and return a recipe draft (nothing is saved)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportTextInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/plan/{week}:
    parameters:
      - { name: week, in: path, required: true, schema: { type: string, format: date }, description: Monday of the week (YYYY-MM-DD) }
    get:
      summary: Get the plan entries of a week
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Week" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/plan/{week}/entries:
    parameters:
      - { name: week, in: path, required: true, schema: { type: string, format: date } }
    post:
      summary: Add an entry to a week
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/PantryFailed" }
  /api/v1/plan/{week}/entries/{id}:
    parameters:
      - { name: week, in: path, required: true, schema: { type: string, format: date } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace a plan entry
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanEntryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/PantryFailed" }
    delete:
      summary: Remove a plan entry
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/plan/{week}/copy:
    parameters:
      - { name: week, in: path, required: true, schema: { type: string, format: date }, description: Target week }
    post:
      summary: Copy all entries of another week into this (empty) week
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromWeek]
              properties:
                fromWeek: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [copied]
                properties:
                  copied: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/shopping:
    get:
      summary: Get the shopping list of a week
      security: [{ session: [] }]
      parameters:
        - { name: week, in: query, required: true, schema: { type: string, format: date }, description: Monday of the week (YYYY-MM-DD) }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/shopping/generate:
    post:
      summary: Generate (or regenerate) the list of a week from the plan, keeping manual items
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [week]
              properties:
                week: { type: string, format: date }
                from: { type: string, format: date, description: Optional first day (requires to) }
                to: { type: string, format: date, description: Optional last day (requires from) }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/shopping/items:
    post:
      summary: Add a manual item
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [week, name]
              properties:
                week: { type: string, format: date }
                name: { type: string }
                quantity: { type: number, nullable: true }
                unit: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/shopping/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Check or uncheck an item, or edit a manual item (name, quantity, unit)
      description: >-
        A body with only `checked` toggles the checkmark (allowed for any item). Sending `name` replaces the
        name, quantity and unit together, so an omitted quantity clears it. Generated items cannot be edited
        (422). A body with neither `checked` nor `name` is rejected with 422.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checked: { type: boolean }
                name: { type: string, description: Manual items only }
                quantity: { type: number, nullable: true }
                unit: { type: string }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      summary: Remove an item
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/me/nutrition:
    get:
      summary: The account's nutrition tracking settings
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Save the account's nutrition tracking settings (kcal 0-20000, other goals 0-2000 g, null = no goal)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionSettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/me/nutrition/days:
    get:
      summary: Daily intake against the goal for a range of at most 31 days (days is empty while tracking is disabled)
      description: Every planned recipe counts as one portion regardless of servings or done; plus the account's food log.
      security: [{ session: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, days]
                properties:
                  enabled: { type: boolean }
                  days:
                    type: array
                    items: { $ref: "#/components/schemas/DaySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/me/food-log:
    post:
      summary: Log a product amount for a day (404 for an unknown or foreign product)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, productId, quantity, unit]
              properties:
                date: { type: string, format: date }
                productId: { type: string }
                quantity: { type: number, exclusiveMinimum: 0, maximum: 10000 }
                unit: { type: string, enum: [g, szt] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
