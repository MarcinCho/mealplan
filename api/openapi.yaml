openapi: 3.0.3
info:
  title: Mealplan API
  version: 0.1.0
  description: REST API of Mealplan. All responses are JSON; errors use the Error schema.
servers:
  - url: /
paths:
  /api/v1/auth/status:
    get:
      summary: Setup state and deployment mode
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /api/v1/auth/setup:
    post:
      summary: Create the first household and admin (only when no users exist)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "204": { description: Created; session cookies set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/auth/login:
    post:
      summary: Log in with login and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204": { description: Logged in; session cookies set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      summary: End the current session
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
  /api/v1/auth/me:
    get:
      summary: Current user, household, role and CSRF token
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/invites:
    post:
      summary: Create a one-time invite (admin)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Created; the token is shown only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfOrForbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      summary: List pending invites (admin)
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/invites/{id}:
    delete:
      summary: Revoke a pending invite of the own household (admin)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfOrForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/invitations/{token}:
    get:
      summary: Inspect an invite link
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteInfo" }
        "404": { $ref: "#/components/responses/InviteInvalid" }
  /api/v1/auth/invitations/{token}/accept:
    post:
      summary: Accept an invite and create an account
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptRequest" }
      responses:
        "204": { description: Account created; session cookies set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/InviteInvalid" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/household/members:
    get:
      summary: Members of the current household
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/recipes:
    get:
      summary: List recipes of the household (without ingredients and steps)
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a recipe
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/recipes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a recipe with ingredients and steps
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Replace a recipe
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      summary: Delete a recipe
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/plan/{week}:
    parameters:
      - { name: week, in: path, required: true, schema: { type: string, format: date }, description: Monday of the week (YYYY-MM-DD) }
    get:
      summary: Get the plan entries of a week
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Week" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/plan/{week}/entries:
    parameters:
      - { name: week, in: path, required: true, schema: { type: string, format: date } }
    post:
      summary: Add an entry to a week
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/plan/{week}/entries/{id}:
    parameters:
      - { name: week, in: path, required: true, schema: { type: string, format: date } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace a plan entry
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanEntryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      summary: Remove a plan entry
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/plan/{week}/copy:
    parameters:
      - { name: week, in: path, required: true, schema: { type: string, format: date }, description: Target week }
    post:
      summary: Copy all entries of another week into this (empty) week
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromWeek]
              properties:
                fromWeek: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [copied]
                properties:
                  copied: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Csrf" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: mealplan_session }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Malformed JSON body (code bad_request)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or expired session (code unauthenticated)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: Wrong login or password (code invalid_credentials)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Admin role required (code forbidden)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Csrf:
      description: Missing or invalid CSRF token (code csrf)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CsrfOrForbidden:
      description: Missing or invalid CSRF token (code csrf) or admin role required (code forbidden)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found in the own household (code not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InviteInvalid:
      description: Invite is invalid, used or expired (code invite_invalid)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict (code setup_done, login_taken, in_use or conflict)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Request body over 1 MiB (code too_large)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Content-Type is not application/json (code unsupported_media_type)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Validation failed (code invalid_input or password_length)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts (code rate_limited)
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: {}
    Status:
      type: object
      properties:
        setupRequired: { type: boolean }
        mode: { type: string, enum: [selfhost, hosted] }
    SetupRequest:
      type: object
      required: [householdName, login, password, displayName]
      properties:
        householdName: { type: string, maxLength: 100 }
        login: { type: string, pattern: "^[a-z0-9._-]{3,64}$" }
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, maxLength: 64 }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }
    AcceptRequest:
      type: object
      required: [login, password, displayName]
      properties:
        login: { type: string, pattern: "^[a-z0-9._-]{3,64}$" }
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, maxLength: 64 }
    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            login: { type: string }
            displayName: { type: string }
        household:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        role: { type: string, enum: [admin, member] }
        csrfToken: { type: string }
    CreateInviteRequest:
      type: object
      properties:
        role: { type: string, enum: [admin, member], default: member }
    CreatedInvite:
      type: object
      properties:
        id: { type: string }
        token: { type: string }
        role: { type: string }
        expiresAt: { type: string, format: date-time }
        path: { type: string }
    Invite:
      type: object
      properties:
        id: { type: string }
        role: { type: string }
        expiresAt: { type: string, format: date-time }
    InviteInfo:
      type: object
      properties:
        householdName: { type: string }
        role: { type: string }
        expiresAt: { type: string, format: date-time }
    Member:
      type: object
      properties:
        id: { type: string }
        login: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, member] }
    Ingredient:
      type: object
      required: [name, quantity, unit]
      properties:
        name: { type: string }
        quantity: { type: number, nullable: true, description: Null when the amount is "to taste" }
        unit: { type: string }
    RecipeInput:
      type: object
      required: [title, baseServings]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        baseServings: { type: integer, minimum: 1, maximum: 100 }
        sourceUrl: { type: string, description: Empty or an http(s) address }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        ingredients: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Ingredient" } }
        steps: { type: array, maxItems: 100, items: { type: string, maxLength: 2000 } }
    Recipe:
      type: object
      required: [id, title, baseServings, sourceUrl, tags, ingredients, steps, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        baseServings: { type: integer }
        sourceUrl: { type: string }
        tags: { type: array, items: { type: string } }
        ingredients: { type: array, items: { $ref: "#/components/schemas/Ingredient" }, description: Empty in list responses }
        steps: { type: array, items: { type: string }, description: Empty in list responses }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlanEntryInput:
      type: object
      required: [date, slot]
      properties:
        date: { type: string, format: date, description: A day within the week }
        slot: { type: string, enum: [breakfast, lunch, dinner, snack] }
        recipeId: { type: string, nullable: true }
        freeText: { type: string }
        servings: { type: integer, description: Zero or omitted means the recipe base servings (or 4) }
        cookUserId: { type: string, nullable: true }
    PlanEntry:
      type: object
      required: [id, date, slot, recipeId, freeText, servings, cookUserId]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        slot: { type: string, enum: [breakfast, lunch, dinner, snack] }
        recipeId: { type: string, nullable: true }
        freeText: { type: string }
        servings: { type: integer }
        cookUserId: { type: string, nullable: true }
    Week:
      type: object
      required: [week, entries]
      properties:
        week: { type: string, format: date }
        entries: { type: array, items: { $ref: "#/components/schemas/PlanEntry" } }
